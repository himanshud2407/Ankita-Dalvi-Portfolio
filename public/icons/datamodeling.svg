  </defs>
  <!-- Connector Lines -->
  <line x1="24" y1="24" x2="9" y2="9" stroke="#8B5CF6" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="24" y1="24" x2="39" y2="9" stroke="#8B5CF6" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="24" y1="24" x2="9" y2="39" stroke="#8B5CF6" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="24" y1="24" x2="39" y2="39" stroke="#8B5CF6" stroke-width="3.5" stroke-linecap="round"/>

  <!-- Dimension Tables -->
  <rect x="2" y="2" width="15" height="15" rx="3.5" fill="url(#modDim)"/>
  <rect x="31" y="2" width="15" height="15" rx="3.5" fill="url(#modDim)"/>
  <rect x="2" y="31" width="15" height="15" rx="3.5" fill="url(#modDim)"/>
  <rect x="31" y="31" width="15" height="15" rx="3.5" fill="url(#modDim)"/>

  <!-- Center Fact Table -->
